<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="jobplusPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="jobplusAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="plusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON BADGE: Modern Shield with Glowing '+' Tech Cross & Pulse Nodes -->
  <g transform="translate(10, 10)">
    <!-- Shield Container -->
    <rect x="5" y="5" width="90" height="90" rx="22" 
          fill="url(#badgeBg)" 
          stroke="url(#jobplusPrimary)" 
          stroke-width="3" />

    <!-- Ambient Glow -->
    <circle cx="50" cy="50" r="30" fill="url(#jobplusAccent)" opacity="0.2" filter="url(#logoGlow)" />

    <!-- Tech Plus Symbol -->
    <path d="M 50 28 L 50 72 M 28 50 L 72 50" 
          stroke="url(#plusGrad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#logoGlow)" />

    <!-- Corner Tech Nodes -->
    <circle cx="28" cy="28" r="3" fill="#38bdf8" />
    <circle cx="72" cy="28" r="3" fill="#a855f7" />
    <circle cx="28" cy="72" r="3" fill="#06b6d4" />
    <circle cx="72" cy="72" r="3" fill="#10b981" />
    
    <!-- Central Node -->
    <circle cx="50" cy="50" r="4.5" fill="#ffffff" />
  </g>

  <!-- TYPOGRAPHY WORDMARK -->
  <g transform="translate(120, 24)">
    <!-- Brand Name: JOBPLUS -->
    <text x="0" y="44" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="44" 
          font-weight="900" 
          letter-spacing="-0.5" 
          fill="#f8fafc">
      JOB<tspan fill="url(#jobplusPrimary)">PLUS</tspan>
    </text>

    <!-- Subtitle / Brand Mission -->
    <text x="3" y="68" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="12.5" 
          font-weight="700" 
          letter-spacing="3.5" 
          fill="#94a3b8">
      AUTONOMOUS CAREER SUITE
    </text>

    <!-- AI BADGE PILL -->
    <g transform="translate(262, 14)">
      <rect x="0" y="0" width="56" height="32" rx="10" fill="url(#jobplusPrimary)" />
      <text x="28" y="22" 
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="16" 
            font-weight="900" 
            letter-spacing="1" 
            fill="#ffffff" 
            text-anchor="middle">
        AI
      </text>
    </g>
  </g>
</svg>
