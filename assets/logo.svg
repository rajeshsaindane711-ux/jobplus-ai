<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON BADGE: Hexagonal Shield + Dynamic Pulse Wave -->
  <g transform="translate(10, 10)">
    <!-- Hexagonal Shield Base -->
    <path d="M 50 2 L 92 24 L 92 76 L 50 98 L 8 76 L 8 24 Z" 
          fill="url(#shieldGrad)" 
          stroke="url(#pulseGrad)" 
          stroke-width="3" 
          stroke-linejoin="round"/>

    <!-- Glowing Core Accent -->
    <circle cx="50" cy="50" r="32" fill="url(#pulseGrad)" opacity="0.15" filter="url(#glow)"/>

    <!-- Dynamic Heartbeat / Career Pulse Line -->
    <path d="M 18 50 L 32 50 L 40 24 L 50 76 L 60 38 L 68 50 L 82 50" 
          fill="none" 
          stroke="url(#pulseGrad)" 
          stroke-width="4" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)"/>

    <!-- Active Pulse Indicator Node -->
    <circle cx="50" cy="50" r="4" fill="#ffffff" />
  </g>

  <!-- WORDMARK TYPOGRAPHY -->
  <g transform="translate(125, 30)">
    <!-- Brand Name: JOBPLUS -->
    <text x="0" y="38" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="42" 
          font-weight="900" 
          letter-spacing="-0.5" 
          fill="#f8fafc">
      JOB<tspan fill="#38bdf8">PULSE</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="3" y="62" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="12" 
          font-weight="600" 
          letter-spacing="3" 
          fill="#94a3b8">
      AUTONOMOUS CAREER ENGINE
    </text>

    <!-- AI BADGE -->
    <g transform="translate(270, 8)">
      <rect x="0" y="0" width="54" height="30" rx="8" fill="url(#pulseGrad)" />
      <text x="27" y="20" 
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="16" 
            font-weight="900" 
            fill="#ffffff" 
            text-anchor="middle">
        AI
      </text>
    </g>
  </g>
</svg>
