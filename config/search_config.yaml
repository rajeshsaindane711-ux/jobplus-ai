# JobPilot AI - Search Criteria & Operational Limits
search:
  keywords:
    - "DevOps Engineer"
    - "SRE Engineer"
    - "Platform Engineer"
    - "Kafka Administrator"
    - "AWS DevOps Engineer"
    - "Azure DevOps Engineer"
  locations:
    - "Pune"
    - "Remote"
    - "Bengaluru"
    - "Hyderabad"
    - "Mumbai"
  experience_min_years: 3
  experience_max_years: 7
  work_modes:
    - "Remote"
    - "Hybrid"
    - "Onsite"

platforms:
  naukri:
    enabled: true
    daily_limit: 30 # Maximum applications per day
    auto_apply: true
    skip_already_applied: true
  linkedin:
    enabled: true
    daily_limit: 25 # Safe limit for LinkedIn Easy Apply
    easy_apply_only: true
    skip_already_applied: true

safety:
  min_delay_seconds: 3 # Minimum delay between actions
  max_delay_seconds: 6 # Maximum randomized delay
  headless: false # Run with visible browser
  take_screenshots_on_apply: true
